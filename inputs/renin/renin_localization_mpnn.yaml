# Renin Localization Config File (ProteinMPNN generator)
# Sampling settings follow Table S3 of the pre-print, for the cytosolic renin
# design campaign.
seed: 42
no_wandb: true
wandb_project: new_provada_renin_mpnn

base_variant:
  sequence_file_path: inputs/renin/example_seq_renin.txt
  fixed_position_files:
    - inputs/renin/conserved_positions.txt
    - inputs/renin/interface_positions.txt
  structure_file_path: inputs/renin/renin_af3.pdb

sampler:
  sampler_type: mada
  greedy: true
  num_iters: 300
  population_size: 30
  top_k_fraction: 0.2
  normalize: false
  score_weights:
    localization_prob: 1
    normalized_hamming_distance: 0.2
    mpnn_score: 0.1

generator:
  generator_type: mpnn_pytorch
  generations_per_sequence: 1
  temperature: 0.5
  excluded_amino_acids: ["C"]

masking_schedule:
  schedule_type: power
  alpha: 3.0
  start_value: 0.2
  stop_value: 0.05

temperature_schedule:
  schedule_type: geometric
  start_value: 2.0
  stop_value: 0.1
